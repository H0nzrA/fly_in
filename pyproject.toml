[project]
name			= "fly-in"
version 		= "0.1.0"
description 	= "42 Fly-in, drone simulation and graph theory"
readme 			= "README.md"
requires-python	= ">=3.10"
dependencies 	= [
    "pydantic>=2.13.4",
    "questionary>=2.1.1",
]

[[project.authors]]
name	= "Teddy Andrianina"
email	= "trakotoz@student.42antananarivo.mg"

[project.scripts]
fly-in	= "fly_in.__main__:main"


[build-system]
requires		= ["hatchling"]
build-backend	= "hatchling.build"

[tool.hatch.build.targets.wheel]
packages	= ["src/fly_in"]

[dependency-groups]
dev	= [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]
